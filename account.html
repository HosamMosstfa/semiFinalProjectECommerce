<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account - Store</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="page" class="site page-category page-account">
      <!-- Off-Canvas Mobile Menu -->
      <aside class="site-off desktop-hide">
        <div class="off-canvas">
          <div class="canvas-head flexitem">
            <div class="logo">
              <a href="index.html"><span class="circle"></span>.store</a>
            </div>
            <a href="#" class="t-close flexcenter" aria-label="Close menu">
              <i class="ri-close-line"></i>
            </a>
          </div>
          <nav>
            <ul class="flexitem second-links">
              <li><a href="index.html">Home</a></li>
              <li><a href="page-category.html">Shop</a></li>
              <li><a href="wishlist.html">Wishlist</a></li>
              <li><a href="account.html">My Account</a></li>
            </ul>
          </nav>
          <div class="thetop-nav"></div>
        </div>
      </aside>

      <!-- Header -->
      <header>
        <div class="header-nav">
          <div class="container">
            <div class="wrapper flexitem">
              <a href="#" class="trigger desktop-hide" aria-label="Open menu">
                <i class="ri-menu-2-line"></i>
              </a>

              <div class="left flexitem">
                <div class="logo">
                  <a href="index.html"><span class="circle"></span>.store</a>
                </div>
                <nav class="mobile-hide">
                  <ul class="flexitem second-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="page-category.html">Shop</a></li>
                    <li><a href="wishlist.html">Wishlist</a></li>
                  </ul>
                </nav>
              </div>

              <div class="right">
                <ul class="flexitem second-links">
                  <li class="theme-control">
                    <a href="#" id="theme-toggle" aria-label="Toggle dark mode">
                      <i class="ri-moon-line"></i>
                    </a>
                  </li>
                  <li class="iscart">
                    <a href="cart.html" aria-label="Shopping cart">
                      <div class="icon-large">
                        <i class="ri-shopping-cart-line"></i>
                        <div class="fly-item">
                          <span class="item-number">0</span>
                        </div>
                      </div>
                      <div class="icon-text">
                        <div class="mini-text">Total</div>
                        <div class="cart-total">$0.00</div>
                      </div>
                    </a>

                    <div class="mini-cart">
                      <div class="content">
                        <div class="cart-head">0 items in cart</div>
                        <div class="cart-body">
                          <ul class="products mini"></ul>
                        </div>
                        <div class="cart-footer">
                          <div class="subtotal">
                            <p>Subtotal</p>
                            <p><strong>$0.00</strong></p>
                          </div>
                          <div class="actions">
                            <a href="checkout.html" class="primary-button">
                              Checkout
                            </a>
                            <a href="cart.html" class="secondary-button">
                              View Cart
                            </a>
                          </div>
                        </div>
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main>
        <div class="container">
          <div id="account-page"></div>
        </div>
      </main>

      <div class="overlay"></div>
    </div>

    <script src="mock-api.js"></script>
    <script src="store.js"></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
  </body>
</html>
