<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - .store</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="page" class="site page-category">
      <header>
        <div class="header-nav">
          <div class="container">
            <div class="wrapper flexitem">
              <div class="left flexitem">
                <div class="logo">
                  <a href="index.html"><span class="circle"></span>.store</a>
                </div>
                <nav class="mobile-hide">
                  <ul class="flexitem second-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="page-category.html">Shop</a></li>
                    <li><a href="wishlist.html">Wishlist</a></li>
                    <li><a href="account.html">My Account</a></li>
                  </ul>
                </nav>
              </div>
              <div class="right">
                <ul class="flexitem second-links">
                  <li class="mobile-hide">
                    <a href="wishlist.html"
                      ><div class="icon-large">
                        <i class="ri-heart-line"></i>
                      </div>
                      <div class="fly-item">
                        <span class="item-number">0</span>
                      </div></a
                    >
                  </li>
                  <li class="iscart">
                    <a href="cart.html">
                      <div class="icon-large">
                        <i class="ri-shopping-cart-line"></i>
                        <div class="fly-item">
                          <span class="item-number">0</span>
                        </div>
                      </div>
                      <div class="icon-text">
                        <div class="mini-text">Total</div>
                        <div class="cart-total">$0.00</div>
                      </div>
                    </a>
                    <div class="mini-cart">
                      <div class="content">
                        <div class="cart-head">0 items in cart</div>
                        <div class="cart-body">
                          <ul class="products mini"></ul>
                        </div>
                        <div class="cart-footer">
                          <div class="subtotal">
                            <p>Subtotal</p>
                            <p><strong>$0.00</strong></p>
                          </div>
                          <div class="actions">
                            <a href="checkout.html" class="primary-button"
                              >Checkout</a
                            ><a href="cart.html" class="secondary-button"
                              >View Cart</a
                            >
                          </div>
                        </div>
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div class="container" style="padding: 36px 15px">
          <div class="breadcrumb">
            <ul class="flexitem">
              <li><a href="index.html">Home</a></li>
              <li>Shop</li>
            </ul>
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              flex-wrap: wrap;
              gap: 16px;
              margin: 16px 0 24px;
            "
          >
            <div>
              <h1>All Products</h1>
              <p id="shop-results-count" class="mini-text">
                Loading products...
              </p>
            </div>
            <div
              style="
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                align-items: center;
              "
            >
              <input
                type="search"
                id="shop-search-input"
                placeholder="Search products or brands..."
                style="
                  padding: 10px 14px;
                  border: 1px solid #d1d5db;
                  border-radius: 8px;
                "
              />
              <select
                id="shop-category-select"
                style="
                  padding: 10px 14px;
                  border: 1px solid #d1d5db;
                  border-radius: 8px;
                "
              >
                <option value="all">All Categories</option>
                <option value="Women">Women's Fashion</option>
                <option value="Men">Men's Fashion</option>
                <option value="Electronic">Electronics</option>
                <option value="Home">Home & Kitchen</option>
                <option value="Sports">Sports</option>
              </select>
              <select
                id="shop-sort-select"
                style="
                  padding: 10px 14px;
                  border: 1px solid #d1d5db;
                  border-radius: 8px;
                "
              >
                <option value="default">Sort: Featured</option>
                <option value="rating">Top Rated</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
              </select>
              <label
                style="
                  font-size: 13px;
                  display: flex;
                  align-items: center;
                  gap: 6px;
                "
              >
                Max: <strong id="shop-price-value">$1,000.00</strong>
                <input
                  type="range"
                  id="shop-price-range"
                  min="30"
                  max="1000"
                  value="1000"
                />
              </label>
              <label
                style="
                  font-size: 13px;
                  display: flex;
                  align-items: center;
                  gap: 5px;
                  cursor: pointer;
                "
              >
                <input type="checkbox" id="shop-instock-only" /> In Stock Only
              </label>
              <button
                type="button"
                id="shop-reset-filters"
                class="ds-btn ds-btn-outline"
              >
                Reset
              </button>
            </div>
          </div>

          <div id="category-products-grid" class="ds-grid"></div>
        </div>
      </main>
    </div>

    <script src="mock-api.js"></script>
    <script src="store.js"></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
  </body>
</html>
